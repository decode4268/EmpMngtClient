
<div class="outer">
    <div class="container">
        <div class="row">
            <div class="offset-md-2 col-lg-5 col-md-7 offset-lg-4 offset-md-3">
                <div class="panel border bg-white">
                    <div class="panel-heading">
                        <h3 class="pt-3 font-weight-bold">Reset Password</h3>
                    </div>

                    <div class="panel-body p-3">
                        <form>

                            <div class="input-field">
                                <span class="fa fa-lock px-2"></span>
                                <input type="password" placeholder="Password" required>
                                <button type="button" class="bg-white text-muted">
                                    <span class="fa fa-eye"></span>
                                </button>
                            </div>
                            <small class="text-danger">* Password is required</small>

                            <div class="input-field mt-2">
                                <span class="fa fa-lock px-2"></span>
                                <input type="password" placeholder="Confirm Password">
                                <button type="button" class="bg-white text-muted">
                                    <span class="fa fa-eye"></span>
                                </button>
                            </div>
                            <small class="text-danger">* Confirm password is required</small>
                            <small class="text-danger">* Password doesn't match</small>

                            <button type="submit" class="btn btn-primary btn-block mt-4 w-100">
                                Reset
                            </button>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
